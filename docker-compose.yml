services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      PORT: "3000"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8080}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-http://localhost:8080}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      RAG_PROVIDER_MODE: "${RAG_PROVIDER_MODE:-studyVault}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_CLIENT_ID: "${VITE_CLIENT_ID:?Set VITE_CLIENT_ID in .env}"
        VITE_RAG_PROVIDER_MODE: "${RAG_PROVIDER_MODE:-studyVault}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
